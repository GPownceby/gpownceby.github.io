<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Advanced analytics and financial management tools for finance professionals.">
  <title>PHP Residual Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background: #0D0D0D;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Background canvas ─────────────────────────────────── */
    #bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Main content ──────────────────────────────────────── */
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 48px 32px 72px;
      gap: 0;
    }

    /* ── Logo mark ─────────────────────────────────────────── */
    .logo-wrap {
      margin-bottom: 40px;
    }

    .logo-mark {
      display: grid;
      grid-template-columns: repeat(4, 18px);
      grid-template-rows: repeat(4, 18px);
      gap: 5px;
    }

    .cell {
      border-radius: 2px;
      opacity: 0;
      transform: scale(0.6);
      animation: cellIn 0.4s ease-out forwards;
    }

    @keyframes cellIn {
      to { opacity: 1; transform: scale(1); }
    }

    /* Row 0 — dark, dark, orange@40%, orange */
    .c0  { background: #2A2A2A;              animation-delay: 0.20s; }
    .c1  { background: #2A2A2A;              animation-delay: 0.30s; }
    .c2  { background: rgba(251,151,48,.40); animation-delay: 0.40s; }
    .c3  { background: #FB9730;              animation-delay: 0.50s; }

    /* Row 1 — dark, orange@50%, orange@80%, orange */
    .c4  { background: #2A2A2A;              animation-delay: 0.30s; }
    .c5  { background: rgba(251,151,48,.50); animation-delay: 0.40s; }
    .c6  { background: rgba(251,151,48,.80); animation-delay: 0.50s; }
    .c7  { background: #FB9730;              animation-delay: 0.60s; }

    /* Row 2 — orange@30%, orange@70%, orange, blue */
    .c8  { background: rgba(251,151,48,.30); animation-delay: 0.40s; }
    .c9  { background: rgba(251,151,48,.70); animation-delay: 0.50s; }
    .c10 { background: #FB9730;              animation-delay: 0.60s; }
    .c11 { background: #5C91AB;              animation-delay: 0.70s; }

    /* Row 3 — orange@80%, orange, blue@70%, blue */
    .c12 { background: rgba(251,151,48,.80); animation-delay: 0.50s; }
    .c13 { background: #FB9730;              animation-delay: 0.60s; }
    .c14 { background: rgba(92,145,171,.70); animation-delay: 0.70s; }
    .c15 { background: #5C91AB;              animation-delay: 0.80s; }

    /* ── Wordmark ──────────────────────────────────────────── */
    .wordmark {
      opacity: 0;
      animation: fadeUp 0.6s ease-out 0.95s forwards;
    }

    .wordmark-main {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(28px, 5.5vw, 60px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
      color: #fff;
      white-space: nowrap;
    }

    /* ── Divider ───────────────────────────────────────────── */
    .divider {
      width: 0;
      height: 1px;
      background: #FB9730;
      margin: 30px 0;
      animation: divExpand 0.5s ease-out 1.35s forwards;
    }

    @keyframes divExpand {
      to { width: 36px; }
    }

    /* ── Email ─────────────────────────────────────────────── */
    .email-wrap {
      opacity: 0;
      animation: fadeUp 0.5s ease-out 1.55s forwards;
    }

    .email-link {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(11px, 1.6vw, 14px);
      font-weight: 400;
      color: #4A4A4A;
      text-decoration: none;
      letter-spacing: 0.01em;
      transition: color 150ms ease-out;
      position: relative;
      display: inline-block;
      padding-bottom: 3px;
    }

    .email-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      right: 50%;
      height: 1px;
      opacity: 0;
      background: #FB9730;
      animation: emailPulse 5s ease-in-out 2s infinite;
    }

    .email-link:hover {
      color: #A0A0A0;
    }

    @keyframes emailPulse {
      0%   { left: 50%; right: 50%; opacity: 0;   background: #FB9730; }
      8%   { left: 50%; right: 50%; opacity: 1;   background: #FB9730; }
      40%  { left: 0;   right: 0;   opacity: 1;   background: #FB9730; }
      48%  { left: 0;   right: 0;   opacity: 0;   background: #FB9730; }
      50%  { left: 50%; right: 50%; opacity: 0;   background: #5C91AB; }
      58%  { left: 50%; right: 50%; opacity: 1;   background: #5C91AB; }
      90%  { left: 0;   right: 0;   opacity: 1;   background: #5C91AB; }
      98%  { left: 0;   right: 0;   opacity: 0;   background: #5C91AB; }
      100% { left: 50%; right: 50%; opacity: 0;   background: #FB9730; }
    }

    /* ── Client login ──────────────────────────────────────── */
    .client-login {
      position: fixed;
      top: 24px;
      right: 28px;
      z-index: 20;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: #A0A0A0;
      text-decoration: none;
      padding: 9px 16px;
      border: 1px solid #2A2A2A;
      border-radius: 4px;
      background: rgba(13, 13, 13, 0.6);
      display: inline-block;
      opacity: 0;
      animation: fadeUp 0.5s ease-out 1.85s forwards;
      transition: color 150ms ease-out, border-color 150ms ease-out;
    }


    .client-login:hover,
    .client-login:focus-visible {
      color: #fff;
      border-color: #FB9730;
      outline: none;
    }


    @media (max-width: 600px) {
      .client-login {
        top: 16px;
        right: 16px;
        font-size: 12px;
        padding: 8px 12px;
      }
    }

    /* ── Legal footer ──────────────────────────────────────── */
    .legal {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      padding: 18px 24px;
      text-align: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: #4A4A4A;
      opacity: 0;
      animation: fadeUp 0.5s ease-out 2.05s forwards;
    }

    .legal span {
      white-space: nowrap;
    }

    .legal .sep {
      margin: 0 10px;
      color: #2A2A2A;
    }

    @media (max-width: 600px) {
      .legal {
        font-size: 10px;
        padding: 14px 16px;
      }

      .legal .sep {
        margin: 0 8px;
      }
    }

    /* ── Shared keyframes ──────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <a class="client-login" href="https://dashboards.phpresidualsolutions.com">Client login</a>

      </a>

  </footer>

  <script>
    /* Sonar grid. A field of small faint dots, each swaying a little
       about its grid point, whose colour drifts between orange and blue
       in soft patches that move across the page. A click or tap sends a
       ring out from wherever it happened; the dots it passes over swell
       and light up in orange or blue, alternating - the same rhythm as
       the underline beneath the email address.

       Rings only ever come from the visitor; PING_EVERY below turns
       ambient rings on if that ever changes. The drift and sway run at
       a low frame rate while no ring is alive, pause in a hidden tab,
       and under prefers-reduced-motion are drawn once and left. */
    (() => {
      const canvas = document.getElementById('bg');
      const ctx = canvas.getContext('2d');

      /* ── Knobs ─────────────────────────────────────────────── */
      const SPACING      = 30;    // px between dots
      const DOT_RADIUS   = 1.0;   // px, at rest
      const REST_ALPHA   = 0.12;  // resting dot opacity
      const PEAK_ALPHA   = 0.85;  // dot opacity at the crest of a ring
      const TINT         = 0.75;  // how far a resting dot leans from grey toward its orange/blue (0 grey, 1 full colour)
      const DRIFT_PERIOD = 7;     // s for a resting dot to go orange -> blue -> orange
      const SWAY         = 2.5;   // px, how far a dot wanders from its grid point
      const SWAY_PERIOD  = 16;    // s, roughly, for one wander; varies a little per dot
      const IDLE_FPS     = 24;    // frame rate of the drift and sway while no ring is alive
      const PING_EVERY   = 0;     // s between ambient rings; 0 means none - rings only on click or tap
      const SPEED        = 220;   // px/s the ring travels
      const RING_WIDTH   = 110;   // px, thickness of the wavefront
      const AMPLITUDE    = 1.5;   // how much a dot grows at the crest (0 none, 1 double, 2 triple); ~2.5px here
      const MAX_RINGS    = 5;     // oldest is dropped first
      const PING_AREA    = [0.1, 0.15, 0.9, 0.85]; // where ambient rings may start, as fractions of the viewport

      const MAX_DPR = 2;
      const TAU     = Math.PI * 2;
      const GREY    = [255, 255, 255];
      const ORANGE  = [251, 151, 48];
      const BLUE    = [92, 145, 171];
      const COLORS  = ['251,151,48', '92,145,171']; // ring colours; rings alternate

      /* Resting dots are drawn in one of these shades - grey pulled part
         way toward a point between orange and blue - so a frame is a
         handful of fills rather than one per dot. */
      const BUCKETS = 16;
      const PALETTE = Array.from({ length: BUCKETS }, (_, b) => {
        const m = b / (BUCKETS - 1);
        const c = GREY.map((g, i) => {
          const tint = ORANGE[i] + (BLUE[i] - ORANGE[i]) * m;
          return Math.round(g + (tint - g) * TINT);
        });
        return `rgba(${c.join(',')},${REST_ALPHA})`;
      });

      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      let W = 0, H = 0;
      let raf = 0, timer = 0;
      let rings = [];
      let ringCount = 0;
      let nextPing = performance.now() + PING_EVERY * 1000;

      function addRing(x, y, born) {
        rings.push({ x, y, born, color: COLORS[ringCount++ % COLORS.length] });
        while (rings.length > MAX_RINGS) rings.shift();
      }

      function draw(now) {
        const lifetime = (Math.hypot(W, H) + RING_WIDTH) / SPEED; // s until a ring has left the viewport
        rings = rings.filter((r) => (now - r.born) / 1000 < lifetime);
        const live = rings.map((r) => {
          const age = (now - r.born) / 1000;
          const radius = age * SPEED;
          return { x: r.x, y: r.y, color: r.color, radius, reach: radius + RING_WIDTH, fade: 1 - age / lifetime };
        });

        ctx.clearRect(0, 0, W, H);

        const cols = Math.ceil(W / SPACING) + 1;
        const rows = Math.ceil(H / SPACING) + 1;
        const offsetX = (W - (cols - 1) * SPACING) / 2;
        const offsetY = (H - (rows - 1) * SPACING) / 2;

        /* Pass 1: every resting dot, batched by shade. Its shade comes
           from two slow waves crossing the grid at different angles and
           speeds, so the colour moves in soft irregular patches rather
           than stripes. Under reduced motion the waves are frozen. */
        const hot = [];
        const paths = PALETTE.map(() => new Path2D());
        const tt = reduceMotion.matches ? 0 : (now / 1000) * (TAU / DRIFT_PERIOD);
        const ts = reduceMotion.matches ? 0 : (now / 1000) * (TAU / SWAY_PERIOD);
        for (let i = 0; i < cols; i++) {
          const gx = offsetX + i * SPACING;
          for (let j = 0; j < rows; j++) {
            const gy = offsetY + j * SPACING;
            /* Each dot wanders on its own small loop around its grid
               point, at its own pace, so the field breathes rather than
               rocking in unison. The pace and phase come from the grid
               index, so a resize does not reshuffle them. */
            const f = 0.8 + 0.4 * (((i * 73 + j * 151) % 17) / 17);
            const cx = gx + Math.sin(ts * f + i * 1.7 + j * 2.3) * SWAY;
            const cy = gy + Math.cos(ts * f * 0.8 + i * 2.1 + j * 1.3) * SWAY;
            let energy = 0;
            let color = null;
            for (const r of live) {
              if (Math.abs(cx - r.x) > r.reach || Math.abs(cy - r.y) > r.reach) continue;
              const dist = Math.abs(Math.hypot(cx - r.x, cy - r.y) - r.radius);
              if (dist >= RING_WIDTH) continue;
              const t = 1 - dist / RING_WIDTH;
              const k = t * t * (3 - 2 * t) * r.fade; // smoothstep, fading with age
              if (k > energy) { energy = k; color = r.color; }
            }
            if (energy < 0.01) {
              const m = 0.5
                + 0.25 * Math.sin(tt + i * 0.16 + j * 0.09)
                + 0.25 * Math.sin(tt * 0.63 - i * 0.07 + j * 0.13);
              const b = Math.max(0, Math.min(BUCKETS - 1, Math.round(m * (BUCKETS - 1))));
              paths[b].moveTo(cx + DOT_RADIUS, cy);
              paths[b].arc(cx, cy, DOT_RADIUS, 0, TAU);
            } else {
              hot.push(cx, cy, energy, color);
            }
          }
        }
        for (let b = 0; b < BUCKETS; b++) {
          ctx.fillStyle = PALETTE[b];
          ctx.fill(paths[b]);
        }

        /* Pass 2: only the dots on a wavefront, each in its ring's colour. */
        for (let k = 0; k < hot.length; k += 4) {
          const energy = hot[k + 2];
          const alpha = REST_ALPHA + (PEAK_ALPHA - REST_ALPHA) * energy;
          ctx.fillStyle = `rgba(${hot[k + 3]},${alpha.toFixed(3)})`;
          ctx.beginPath();
          ctx.arc(hot[k], hot[k + 1], DOT_RADIUS * (1 + AMPLITUDE * energy), 0, TAU);
          ctx.fill();
        }
      }

      function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        const dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
        canvas.width  = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        draw(performance.now());
      }

      function scheduleIdle(delay) {
        clearTimeout(timer);
        timer = setTimeout(() => tick(performance.now()), Math.max(16, delay));
      }

      function tick(now) {
        raf = 0;
        if (document.hidden) return;
        if (reduceMotion.matches) {
          rings = [];
          draw(now);
          return;
        }
        if (PING_EVERY > 0 && now >= nextPing) {
          const [x0, y0, x1, y1] = PING_AREA;
          addRing(W * (x0 + Math.random() * (x1 - x0)), H * (y0 + Math.random() * (y1 - y0)), now);
          nextPing = now + PING_EVERY * 1000;
        }
        draw(now);
        /* Full frame rate while a ring is moving; the slow colour drift
           on its own gets by on far fewer frames. */
        if (rings.length > 0) raf = requestAnimationFrame(tick);
        else scheduleIdle(1000 / IDLE_FPS);
      }

      function wake() {
        if (!raf) {
          clearTimeout(timer);
          raf = requestAnimationFrame(tick);
        }
      }

      window.addEventListener('pointerdown', (e) => {
        if (reduceMotion.matches) return;
        if (e.target.closest('a, button')) return; // a click on a link is a click, not a ping
        addRing(e.clientX, e.clientY, performance.now());
        wake();
      });
      window.addEventListener('resize', resize);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
      reduceMotion.addEventListener('change', wake);

      resize();
      wake();
    })();
  </script>

</body>
